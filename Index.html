<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Date?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef0ff;--ink:#2b1b4a;--muted:#6d628a;--card:#ffffff;--line:#d9dcf5;--pop:#e8325a;--popink:#ffffff;--soft:#ffe3ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1530;--ink:#f1ecff;--muted:#a79bc8;--card:#2a2147;--line:#3d3364;--pop:#ff5c7f;--popink:#1c1530;--soft:#4a2a45}}
:root[data-theme="dark"]{--bg:#1c1530;--ink:#f1ecff;--muted:#a79bc8;--card:#2a2147;--line:#3d3364;--pop:#ff5c7f;--popink:#1c1530;--soft:#4a2a45}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.5}
main{max-width:460px;margin:0 auto;padding:40px 20px 60px;min-height:80vh}
.step{display:none}.step.on{display:block}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:clamp(2rem,8.5vw,2.8rem);line-height:1.1;margin:0 0 14px}
.lead{color:var(--muted);font-size:1.05rem;margin:0 0 28px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;font:700 1.05rem "DM Sans",system-ui,sans-serif;background:var(--pop);color:var(--popink);cursor:pointer;margin-top:12px}
.btn.alt{background:transparent;color:var(--muted);font-weight:500;border:1px solid var(--line)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.day:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.hint{color:var(--muted);margin:12px 0 0;min-height:1.5em}
.month{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 14px 14px;margin-bottom:18px}
.month h2{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:1.4rem;margin:0 0 10px 6px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:.78rem;color:var(--muted);padding-bottom:4px}
.day{aspect-ratio:1;border:0;border-radius:50%;background:transparent;color:var(--ink);font:500 1rem "DM Sans",system-ui,sans-serif;cursor:pointer}
.day:hover{background:var(--soft)}
.day[aria-pressed="true"],.opt[aria-pressed="true"]{background:var(--pop);color:var(--popink);font-weight:700}
.blank{visibility:hidden}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px 18px;font:500 1.1rem "DM Sans",system-ui,sans-serif;margin-bottom:10px;cursor:pointer}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font:400 1rem "DM Sans",system-ui,sans-serif;background:var(--card);color:var(--ink);margin-top:2px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:0 0 8px}
.sum p{margin:0}.sum p+p{margin-top:12px}
.sum small{display:block;color:var(--muted)}
.sum span{font-family:"Young Serif",Georgia,serif;font-size:1.35rem}
</style>
</head>
<body>
<main>

<section class="step on" id="s1">
<h1>Do you want to go on a date with me? 🙂</h1>
<p class="lead">Simple question. Take your time.</p>
<button class="btn" id="yes">Yes</button>
<button class="btn alt" id="maybe">Let me think</button>
<p class="hint" id="mh"></p>
</section>

<section class="step" id="s2">
<h1>Great. Which day?</h1>
<p class="lead">Pick any day from November 1 to December 31.</p>
<div id="cal"></div>
<button class="btn" id="n2" disabled>Next</button>
</section>

<section class="step" id="s3">
<h1>What are you in the mood for?</h1>
<p class="lead">Keep it easy or make it a whole evening. Your call.</p>
<button class="opt" data-v="Coffee">☕ Just coffee</button>
<button class="opt" data-v="Dinner">🍽️ Dinner</button>
<button class="opt" data-v="Something else">✨ Something else</button>
<input type="text" id="other" placeholder="What do you have in mind?" hidden aria-label="Your idea">
<button class="btn" id="n3" disabled>Done</button>
</section>

<section class="step" id="s4">
<h1>It’s a date 🎉</h1>
<div class="sum">
<p><small>Day</small><span id="rd"></span></p>
<p><small>Plan</small><span id="rp"></span></p>
</div>
<p class="lead" style="margin-top:20px">Take a screenshot of this page and send it to me 😉</p>
</section>

</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var names=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var mn=['January','February','March','April','May','June','July','August','September','October','November','December'];
var YEAR=2026,selDay=null,dayText='',plan='';
function show(n){['s1','s2','s3','s4'].forEach(function(s){$(s).classList.toggle('on',s===n)});window.scrollTo(0,0)}
$('yes').onclick=function(){show('s2')};
$('maybe').onclick=function(){$('mh').textContent='Fair enough. I’ll be here. 🙂'};
[10,11].forEach(function(m){
  var box=document.createElement('section');box.className='month';
  var h=document.createElement('h2');h.textContent=mn[m]+' '+YEAR;box.appendChild(h);
  var g=document.createElement('div');g.className='grid';
  'SMTWTFS'.split('').forEach(function(d){var e=document.createElement('div');e.className='dow';e.textContent=d;g.appendChild(e)});
  var first=new Date(YEAR,m,1).getDay(),days=new Date(YEAR,m+1,0).getDate();
  for(var i=0;i<first;i++){var b=document.createElement('div');b.className='blank';g.appendChild(b)}
  for(var d=1;d<=days;d++){(function(d){
    var t=names[new Date(YEAR,m,d).getDay()]+', '+mn[m]+' '+d;
    var btn=document.createElement('button');btn.className='day';btn.type='button';btn.textContent=d;
    btn.setAttribute('aria-pressed','false');btn.setAttribute('aria-label',t);
    btn.onclick=function(){
      if(selDay)selDay.setAttribute('aria-pressed','false');
      selDay=btn;btn.setAttribute('aria-pressed','true');dayText=t;$('n2').disabled=false;
    };
    g.appendChild(btn);
  })(d)}
  box.appendChild(g);$('cal').appendChild(box);
});
$('n2').onclick=function(){show('s3')};
var opts=document.querySelectorAll('.opt');
function check(){$('n3').disabled=!plan||(plan==='Something else'&&!$('other').value.trim())}
opts.forEach(function(o){o.setAttribute('aria-pressed','false');o.onclick=function(){
  opts.forEach(function(x){x.setAttribute('aria-pressed','false')});
  o.setAttribute('aria-pressed','true');plan=o.getAttribute('data-v');
  $('other').hidden=plan!=='Something else';
  if(plan==='Something else')$('other').focus();
  check();
}});
$('other').oninput=check;
$('n3').onclick=function(){
  $('rd').textContent=dayText;
  $('rp').textContent=plan==='Something else'?$('other').value.trim():plan;
  show('s4');
};
})();
</script>
</body>
</html>
